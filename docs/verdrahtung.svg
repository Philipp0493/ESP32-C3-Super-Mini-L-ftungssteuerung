<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Verdrahtung ESP32-C3, Waveshare TTL TO RS485 C und Ambientika</title><desc id="desc">GPIO5 an RXD, GPIO4 an TXD. Wandler A an Klemme4, B an Klemme3, PE Signalmasse an Klemme5. Keine Massebrücke über die Isolation.</desc><rect width="1200" height="650" fill="#f3f6f8"/><g font-family="Arial,sans-serif" fill="#183747"><text x="40" y="45" font-size="25" font-weight="bold">Ein Lüfter · Kleinspannungs- und Datenverdrahtung</text><text x="40" y="80" font-size="17">ESP per USB versorgen · Wandler mit 3,3 V versorgen · nur spannungsfrei verdrahten</text><rect x="40" y="125" width="230" height="310" rx="15" fill="white" stroke="#7792a0"/><text x="58" y="161" font-size="22" font-weight="bold">ESP32-C3</text><text x="58" y="190" font-size="16">Super Mini</text><rect x="420" y="125" width="370" height="310" rx="15" fill="white" stroke="#7792a0"/><text x="438" y="161" font-size="22" font-weight="bold">Waveshare</text><text x="438" y="190" font-size="16">TTL TO RS485 (C)</text><rect x="960" y="125" width="210" height="310" rx="15" fill="white" stroke="#7792a0"/><text x="978" y="161" font-size="22" font-weight="bold">Ambientika</text><text x="978" y="190" font-size="16">Master mit Wandpanel</text><path d="M610 210V425" stroke="#889da6" stroke-width="2" stroke-dasharray="6 6"/><text x="605" y="458" text-anchor="middle" font-size="17">Galvanische Trennung erhalten</text><text x="60" y="246" font-size="19">3V3</text><path d="M255 240H435" stroke="#b94c42" stroke-width="4"/><text x="450" y="246" font-size="19">VCC</text><text x="60" y="296" font-size="19">GND</text><path d="M255 290H435" stroke="#424e58" stroke-width="4"/><text x="450" y="296" font-size="19">GND</text><text x="60" y="346" font-size="19">GPIO5 TX</text><path d="M255 340H435" stroke="#295fbc" stroke-width="4"/><text x="450" y="346" font-size="19">RXD</text><text x="60" y="396" font-size="19">GPIO4 RX</text><path d="M255 390H435" stroke="#ad5b14" stroke-width="4"/><text x="450" y="396" font-size="19">TXD</text><text x="650" y="256" font-size="20">A+</text><path d="M760 250H975" stroke="#7850ae" stroke-width="4"/><text x="992" y="256" font-size="19">4 / A</text><text x="650" y="316" font-size="20">B−</text><path d="M760 310H975" stroke="#078783" stroke-width="4"/><text x="992" y="316" font-size="19">3 / B</text><text x="650" y="376" font-size="20">PE</text><path d="M760 370H975" stroke="#636b75" stroke-width="4"/><text x="992" y="376" font-size="19">5 / GND</text><text x="40" y="505" font-size="18">A/B verdrillen; Bus-GND separat führen. 120 Ω am letzten Teilnehmer laut Südwind.</text><text x="40" y="540" font-size="18">PE bedeutet hier RS485-Signalmasse laut Waveshare, nicht Netz-Schutzleiter.</text><text x="40" y="575" font-size="18">Keine Brücke zwischen ESP-/TTL-GND und busseitigem PE setzen.</text><text x="40" y="615" font-size="18" font-weight="bold">230-V-Versorgung des Lüfters ist nicht dargestellt: Anschluss durch Elektrofachkraft.</text></g></svg>